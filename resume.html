<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koushik Sarun Reddy | Resume</title>
  <meta name="description" content="Resume for Koushik Sarun Reddy.">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: #111827;
      color: #f8fafc;
      font-family: Arial, system-ui, sans-serif;
    }

    .resume-toolbar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: rgba(17, 24, 39, 0.94);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .resume-toolbar strong {
      font-size: 1rem;
    }

    .resume-actions {
      display: flex;
      gap: 0.5rem;
    }

    .resume-actions a {
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 8px;
      color: #111827;
      background: #f8fafc;
      padding: 0.6rem 0.8rem;
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
    }

    .resume-preview {
      min-height: calc(100vh - 3.6rem);
      padding: 1.5rem;
      background: #1f2937;
    }

    .resume-preview img {
      display: block;
      width: min(100%, 980px);
      height: auto;
      margin: 0 auto;
      border-radius: 4px;
      background: #ffffff;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
    }

    @media (max-width: 560px) {
      .resume-toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .resume-preview {
        min-height: calc(100vh - 6.8rem);
        padding: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <header class="resume-toolbar">
    <strong>Koushik Sarun Reddy Resume</strong>
    <nav class="resume-actions" aria-label="Resume actions">
      <a href="index.html">Portfolio</a>
      <a href="koushiksarunreddy_yuvachandran_resume.pdf" download="koushiksarunreddy_yuvachandran_resume.pdf" type="application/pdf">Download</a>
    </nav>
  </header>
  <main class="resume-preview">
    <img src="assets/resume-preview.png" alt="Preview of Koushik Sarun Reddy's resume">
  </main>
</body>
</html>
